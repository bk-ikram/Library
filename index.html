<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="exercise.js" defer></script>
    <title>Document</title>

<body>
    <dialog>
        
        <form method="dialog">
            <h1>Enter the following details for the book you wish to add</h1>
            <p>
                <label for="title">Title</label>
                <input id="title" name="title" type="text" required>
            </p>
            <p>
                <label for="author">Author</label>
                <input id="author" name="author" type="text" required>
            </p>
            <p>
                <label for="pages">Number of Pages</label>
                <input id="pages" name="pages" type="number">
            </p>

            <fieldset>
                <legend>Have you read this book yet?</legend>
                <div>
                    <input id="read" name="status" type="radio" value="read">
                    <label for="read">Read</label>
                </div>
                <div>
                    <input id="unread" name="status" type="radio" value="unread">
                    <label for="unread">Not Yet</label>
                </div>
            </fieldset>
            <div class="buttons">
                <button value="cancel" formmethod="dialog">Cancel</button>
                <button id="confirmBtn" value="default">Add</button>
            </div>
        </form>
        
    </dialog>
    <div class="shelf">
        <div class="book unread hide">

            <h2 class="book-pages">63 pages</h2>
